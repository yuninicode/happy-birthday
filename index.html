<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>生日快乐 · 星河蛋糕</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:"Microsoft YaHei UI","PingFang SC",sans-serif;background:#252426}
    button{font:inherit}.scene{position:fixed;inset:0}
    .scene-bg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;user-select:none}.scene-bg.fill{object-fit:cover;filter:blur(18px) brightness(.82);transform:scale(1.06)}.scene-bg.full{object-fit:contain;z-index:1}.scene-bg.mobile{display:none;object-fit:cover;z-index:1}
    #introScene{z-index:20;background:#6e4d78;transition:opacity .55s ease,visibility .55s}
    #musicGate{position:fixed;z-index:21;left:50vw;top:50vh;width:244px;height:176px;transform:translate(-50%,-50%) scale(.88);border:1px solid rgba(255,255,255,.45);border-radius:17px;background:rgba(255,245,255,.25);box-shadow:0 12px 38px rgba(75,34,84,.19),inset 0 1px rgba(255,255,255,.38);backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;color:white;cursor:pointer;text-shadow:0 1px 4px rgba(94,43,85,.35);opacity:0;visibility:hidden;transition:opacity .48s ease,transform .48s cubic-bezier(.2,.9,.25,1.18),visibility .48s}
    #musicGate.show{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1)}
    #musicGate strong{font-size:22px;margin-bottom:12px}#musicGate span{font-size:13px;opacity:.86}#musicGate:hover{background:rgba(255,250,255,.32)}
    #wishScene{z-index:3;overflow:hidden;background:#6e4d78;transition:opacity .48s ease,visibility .48s}
    #wishScene::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,rgba(255,255,255,.16),transparent 28%,rgba(255,255,255,.08));mix-blend-mode:screen}
    .script-bg{display:none;position:absolute;left:48%;top:48%;transform:translate(-50%,-50%) rotate(-4deg);width:min(720px,70vw);color:#d82455;opacity:.82;text-align:center;line-height:.8;user-select:none}
    .script-bg .cn{font-family:"KaiTi","STKaiti",serif;font-size:clamp(64px,8.8vw,118px);font-weight:700;letter-spacing:-.06em;text-shadow:0 8px 30px rgba(197,35,82,.1)}
    .script-bg .en{margin-left:24%;font-family:"Segoe Script","Brush Script MT",cursive;font-size:clamp(24px,3.4vw,48px);font-weight:400;letter-spacing:.01em}
    #heartLayer{position:absolute;inset:0;z-index:2}
    .wish-card{position:absolute;width:158px;height:66px;border:1px solid rgba(99,94,104,.16);border-radius:5px;background:var(--card);box-shadow:0 5px 13px rgba(93,65,79,.22),inset 0 1px rgba(255,255,255,.8);color:#3d3740;overflow:hidden;opacity:0;transform:translate(-50%,-50%) scale(.72);animation:cardIn .22s cubic-bezier(.2,.85,.25,1.2) forwards}
    .wish-card .bar{height:20px;padding:2px 8px;border-bottom:1px solid rgba(80,72,80,.11);display:flex;align-items:center;justify-content:space-between;font:12px/1 Arial,sans-serif;color:#77717a;background:rgba(255,255,255,.28)}
    .wish-card .msg{height:45px;display:grid;place-items:center;padding:2px 8px;text-align:center;font-size:13px;font-weight:700;white-space:nowrap}
    @keyframes cardIn{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
    #heroCard{position:fixed;z-index:500;left:50vw;top:50vh;width:360px;height:180px;transform:translate(-50%,-50%) scale(.88);border:1px solid rgba(172,110,131,.14);border-radius:22px;background:rgba(255,250,250,.94);box-shadow:0 19px 48px rgba(109,56,76,.23),inset 0 1px rgba(255,255,255,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .45s ease,transform .45s ease,visibility .45s}
    #heroCard.show{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1)}
    #heroCard h1{margin:0 0 12px;color:#ce2648;font-size:30px;line-height:1;font-weight:800;letter-spacing:.03em}
    #heroCard p{margin:0;color:#846f76;font-size:14px}.tiny-heart{margin-top:22px;color:#c99ba9;font-size:14px}
    #enterCake{position:absolute;z-index:510;left:50%;bottom:28px;transform:translateX(-50%) translateY(12px);height:42px;padding:0 23px;border:1px solid rgba(131,92,108,.14);border-radius:999px;background:rgba(255,250,250,.94);box-shadow:0 9px 22px rgba(104,59,76,.18),inset 0 1px rgba(255,255,255,.95);color:#5f4c54;font-size:14px;font-weight:700;letter-spacing:.02em;cursor:pointer;opacity:0;visibility:hidden;transition:opacity .35s,transform .35s,background .18s}
    #enterCake.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}#enterCake:hover{background:#fff;transform:translateX(-50%) translateY(-2px)}#enterCake:active{transform:translateX(-50%) translateY(0)}
    #cakeScene{z-index:1;background:#2b2b2d;opacity:0;visibility:hidden;transition:opacity .5s ease,visibility .5s}
    #cakeScene.show{opacity:1;visibility:visible}#cakeFrame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#2b2b2d}
    .cake-nav{position:absolute;z-index:12;top:auto;bottom:18px;width:42px;height:42px;padding:0;border:1px solid rgba(230,207,255,.28);border-radius:7px;background:rgba(35,30,43,.72);box-shadow:0 0 14px rgba(177,119,232,.2);backdrop-filter:blur(8px);color:#ddd4e4;font-size:0;font-weight:700;cursor:pointer}
    .cake-nav::first-letter{font-size:18px}#turnCake{top:20px;left:20px;bottom:auto;width:auto;padding:0 18px;border-radius:999px;font-size:13px;color:#fff0dc}#turnCake::first-letter{font-size:15px}#musicBtn,#decorateBtn,#confettiBtn{display:none}#backWish{top:20px;right:20px;bottom:auto;width:auto;padding:0 17px;border-radius:8px;background:rgba(113,73,130,.72);font-size:13px}#backWish::first-letter{font-size:13px}
    #confettiCanvas{position:absolute;inset:0;z-index:9;width:100%;height:100%;pointer-events:none}
    #cakeDecor{position:absolute;inset:0;z-index:7;pointer-events:none}.decor-item{position:absolute;left:50%;top:30%;font-size:30px;filter:drop-shadow(0 0 7px #fff);transform:translate(-50%,-50%)}
    #cakeWriting{position:absolute;z-index:8;left:50%;top:66%;transform:translate(-50%,-50%);color:white;font:700 22px/1 "Segoe Script","Microsoft YaHei UI";text-shadow:0 0 8px #ff70d0,0 2px 3px #30102a;pointer-events:none}
    #decorPanel{position:absolute;z-index:11;left:50%;bottom:18px;transform:translateX(-50%) translateY(130%);width:min(1160px,calc(100vw - 36px));min-height:112px;padding:12px 16px;border:1px solid rgba(185,145,255,.42);border-radius:18px;background:rgba(29,22,49,.9);box-shadow:0 0 24px rgba(137,75,222,.25);backdrop-filter:blur(12px);color:#e9dfff;transition:transform .35s ease}
    #decorPanel.show{transform:translateX(-50%) translateY(0)}.decor-tabs,.decor-options{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.decor-tabs{padding-bottom:9px;border-bottom:1px solid rgba(255,255,255,.12)}
    .decor-tabs button,.decor-options button{border:1px solid rgba(214,185,255,.25);border-radius:8px;background:#ffffff0b;color:#e8dcff;padding:7px 12px;cursor:pointer}.decor-tabs button.active,.decor-options button:hover,.decor-options button.active{background:#b86cff55;border-color:#d7afff;box-shadow:0 0 10px rgba(198,128,255,.22)}.decor-options{padding-top:10px}
    .decor-options input{height:32px;border:1px solid #b78ad4;border-radius:8px;background:#1e1730;color:white;padding:0 10px;outline:none}
    .panel-head{display:flex;align-items:center;justify-content:space-between}.panel-actions{display:flex;gap:7px}.panel-actions button{border:1px solid rgba(214,185,255,.28);border-radius:9px;background:#ffffff12;color:#f0e7ff;padding:7px 12px;cursor:pointer}.panel-actions .done{background:#bc76e9;color:white}
    .option-row{display:flex;align-items:center;gap:7px;width:100%;flex-wrap:nowrap}.option-row button{flex:0 0 auto;white-space:nowrap;word-break:keep-all;line-height:1;padding:7px 10px}.option-label{flex:0 0 42px;width:42px;color:#cbb9e2;font-size:12px}.swatch{display:inline-block;width:14px;height:14px;margin-right:5px;border-radius:50%;vertical-align:-2px;box-shadow:0 0 7px currentColor}
    #completeToast{position:absolute;z-index:15;left:50%;top:31%;transform:translate(-50%,-12px);padding:10px 22px;border:1px solid rgba(255,218,151,.45);border-radius:999px;background:rgba(40,30,36,.82);color:#ffe9bd;font-size:16px;box-shadow:0 0 22px rgba(255,210,109,.24);opacity:0;visibility:hidden;transition:.4s}#completeToast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}
    #finalBlessing{position:absolute;z-index:16;left:50%;top:50%;width:min(510px,82vw);min-height:205px;transform:translate(-50%,-50%) scale(.92);padding:30px 42px;border:1px solid rgba(255,255,255,.55);border-radius:17px;background:rgba(255,245,250,.24);box-shadow:0 18px 50px rgba(20,10,24,.28),inset 0 1px rgba(255,255,255,.4);backdrop-filter:blur(13px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;line-height:1.95;text-shadow:0 1px 5px rgba(50,20,45,.6);opacity:0;visibility:hidden;transition:.55s}#finalBlessing.show{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1)}
    @media(max-width:700px) and (orientation:portrait){.scene-bg.fill,.scene-bg.full{display:none}.scene-bg.mobile{display:block}.wish-card{width:128px;height:56px}.wish-card .msg{font-size:11px;height:35px}#heroCard{width:min(310px,86vw);height:164px}#heroCard h1{font-size:26px}#enterCake{bottom:max(20px,env(safe-area-inset-bottom))}}
  </style>
</head>
<body>
  <section id="introScene" class="scene">
    <img class="scene-bg fill" src="birthday-background.png?v=4" alt=""><img class="scene-bg full" src="birthday-background.png?v=4" alt=""><img class="scene-bg mobile" src="birthday-background-mobile.png?v=1" alt="">
    <button id="musicGate"><strong>点击开启音乐</strong><span>开启后陪你走完这段生日 ♫</span></button>
  </section>
  <section id="cakeScene" class="scene" aria-hidden="true">
    <iframe id="cakeFrame" src="birthday-cake.html" title="星河生日蛋糕"></iframe>
    <button id="turnCake" class="cake-nav">🎂 组装我的蛋糕</button>
    <button id="musicBtn" class="cake-nav">♫ 音乐</button>
    <button id="decorateBtn" class="cake-nav">✦ 装饰</button>
    <button id="confettiBtn" class="cake-nav">🎉 彩带</button>
    <button id="backWish" class="cake-nav">← 返回祝心</button>
    <canvas id="confettiCanvas"></canvas>
    <div id="cakeDecor"></div><div id="cakeWriting"></div>
    <div id="completeToast">专属蛋糕完成！</div>
    <div id="finalBlessing"></div>
    <div id="decorPanel">
      <div class="panel-head"><div class="decor-tabs">
        <button class="active" data-tab="layers">蛋糕层</button><button data-tab="cream">奶油</button><button data-tab="decor">装饰</button><button data-tab="write">写字</button><button data-tab="candles">蜡烛</button><button data-tab="plate">底盘</button>
      </div><div class="panel-actions"><button id="randomCake">🎲 随机</button><button id="foldPanel">合上</button><button id="exportCake">导出</button><button id="doneCake" class="done">完成</button></div></div>
      <div id="decorOptions" class="decor-options"></div>
    </div>
  </section>

  <section id="wishScene" class="scene">
    <img class="scene-bg fill" src="birthday-background.png?v=4" alt=""><img class="scene-bg full" src="birthday-background.png?v=4" alt=""><img class="scene-bg mobile" src="birthday-background-mobile.png?v=1" alt="">
    <div class="script-bg"><div class="cn">生日快乐</div><div class="en">Happy Birthday</div></div>
    <div id="heartLayer"></div>
    <div id="heroCard">
      <h1>生日快乐 ❤️</h1>
      <p>愿你新的一岁，继续闪闪发光</p>
      <div class="tiny-heart">♡</div>
    </div>
    <button id="enterCake">🎂&nbsp;&nbsp;进入星河蛋糕&nbsp;&nbsp;→</button>
  </section>

  <script>
    const messages=['希望你永远做自己','好好爱自己','好好吃饭','保持好心情','顺顺利利','别熬夜','天凉了多穿衣服','愿望都实现','天天开心','平安喜乐','万事胜意','好运连连','新的一岁闪闪发光','未来可期','心想事成','永远被爱包围','充实自己','愿所有美好如期而至'];
    const pastels=['#f8e8ec','#e4f2f7','#e7f5ee','#fff3cf','#eee6f8','#f8e1ec','#ddf1ed','#faead9'];
    const layer=document.querySelector('#heartLayer'), hero=document.querySelector('#heroCard'), enter=document.querySelector('#enterCake');
    const wish=document.querySelector('#wishScene'), cake=document.querySelector('#cakeScene'),intro=document.querySelector('#introScene');
    let timers=[];
    function clearTimers(){timers.forEach(clearTimeout);timers=[]}
    function buildHeart(){
      clearTimers();layer.innerHTML='';hero.classList.remove('show');enter.classList.remove('show');wish.style.opacity='1';wish.style.visibility='visible';
      const count=112,w=innerWidth,h=innerHeight,cardW=w<700?128:158,cardH=w<700?56:66;
      const scale=Math.min((w*.64-cardW)/32,(h*.76-cardH)/29),cx=w/2,cy=h*.48;
      for(let i=0;i<count;i++){
        const t=Math.PI*2*i/count,ring=1-(i%4)*.025;
        const x=cx+(-16*Math.sin(t)**3)*scale*ring;
        const y=cy-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*scale*ring;
        const el=document.createElement('div');el.className='wish-card';el.style.left=x+'px';el.style.top=y+'px';el.style.zIndex=20+i;el.style.setProperty('--card',pastels[i%pastels.length]);el.style.animationDelay=(i*54)+'ms';
        el.innerHTML='<div class="bar"><span>♡</span><span>×</span></div><div class="msg">'+messages[(i*7)%messages.length]+'</div>';layer.appendChild(el);
      }
      timers.push(setTimeout(()=>hero.classList.add('show'),count*54+360));
      timers.push(setTimeout(()=>enter.classList.add('show'),count*54+760));
    }
    function showCake(){
      wish.style.opacity='0';wish.style.visibility='hidden';cake.classList.add('show');cake.setAttribute('aria-hidden','false');
    }
    function showWish(){cake.classList.remove('show');cake.setAttribute('aria-hidden','true');buildHeart()}
    enter.addEventListener('click',showCake);
    document.querySelector('#backWish').addEventListener('click',showWish);
    document.querySelector('#turnCake').addEventListener('click',()=>{panel.classList.add('show')});
    const birthdaySong=new Audio('./3-strikes.mp3');
    birthdaySong.preload='auto';
    birthdaySong.volume=.82;
    let musicOn=false,musicStarted=false;
    birthdaySong.addEventListener('loadedmetadata',()=>{if(!musicStarted){try{birthdaySong.currentTime=11}catch(_){}}});
    birthdaySong.addEventListener('ended',()=>{musicOn=false;musicStarted=false;const b=document.querySelector('#musicBtn');if(b)b.textContent='♫ 音乐'});
    function toggleMusic(){const b=document.querySelector('#musicBtn');if(!musicOn){const first=!musicStarted||birthdaySong.ended;if(first){musicStarted=true;try{birthdaySong.currentTime=11}catch(_){}}birthdaySong.play().then(()=>{if(first&&birthdaySong.currentTime<10.5){birthdaySong.currentTime=11}musicOn=true;b.textContent='❚❚ 音乐'}).catch(()=>{musicOn=false;musicStarted=false;b.textContent='♫ 音乐'})}else{birthdaySong.pause();musicOn=false;b.textContent='♫ 音乐'}}
    document.querySelector('#musicBtn').addEventListener('click',toggleMusic);

    const confettiCanvas=document.querySelector('#confettiCanvas'),ctx=confettiCanvas.getContext('2d');let confetti=[],confettiRunning=false;
    function sizeCanvas(){confettiCanvas.width=innerWidth*devicePixelRatio;confettiCanvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}sizeCanvas();
    function launchConfetti(){const colors=['#ff4f9a','#ffcf35','#41d7ff','#8b6cff','#4beba0','#ffffff','#ff7657'];for(let i=0;i<850;i++)confetti.push({x:Math.random()*innerWidth,y:-40-Math.random()*innerHeight*.42,vx:(Math.random()-.5)*6,vy:6+Math.random()*9,w:3+Math.random()*8,h:2+Math.random()*5,r:Math.random()*6.28,vr:(Math.random()-.5)*.42,c:colors[i%colors.length],life:150+Math.random()*150});if(!confettiRunning){confettiRunning=true;requestAnimationFrame(drawConfetti)}}
    function drawConfetti(){ctx.clearRect(0,0,innerWidth,innerHeight);confetti=confetti.filter(p=>p.life-->0&&p.y<innerHeight-8);for(const p of confetti){p.x+=p.vx+Math.sin(p.r)*.9;p.y+=p.vy;p.r+=p.vr;p.vy+=.045;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.globalAlpha=Math.min(1,Math.max(0,(innerHeight-p.y)/90));ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()}if(confetti.length)requestAnimationFrame(drawConfetti);else{confettiRunning=false;ctx.clearRect(0,0,innerWidth,innerHeight)}}
    const blessingText='希望你不用持续成长，\n不需要去理解那些复杂矛盾的东西，\n不用做令人烦恼的选择，\n永远有人陪你！';let blessingTimer=null;
    function typeBlessing(){const card=document.querySelector('#finalBlessing');clearInterval(blessingTimer);card.innerHTML='';card.classList.add('show');let i=0;blessingTimer=setInterval(()=>{const ch=blessingText[i++];if(ch==='\n')card.appendChild(document.createElement('br'));else card.append(ch);if(i>=blessingText.length)clearInterval(blessingTimer)},72)}
    function celebrate(){launchConfetti();const card=document.querySelector('#finalBlessing');card.classList.remove('show');setTimeout(typeBlessing,900)}
    document.querySelector('#confettiBtn').addEventListener('click',celebrate);

    const panel=document.querySelector('#decorPanel'),opts=document.querySelector('#decorOptions'),frame=document.querySelector('#cakeFrame'),decor=document.querySelector('#cakeDecor'),writing=document.querySelector('#cakeWriting');
    const cakeConfig={shape:'round',layers:1,flavor:'#173fa8',palette:['#173fa8'],style:'galaxy',cream:'#fff4f6',decor:'stars',motif:'garland',candles:1,plate:'#ecdce8',metalPlate:false};
    const cakePresets=[
      {name:'星河鎏金',shape:'round',layers:2,palette:['#142d87','#6947c7'],style:'galaxy',cream:'#fff8ff',decor:'stars',motif:'constellation',candles:1,plate:'#182b72',metalPlate:false},
      {name:'草莓绮梦',shape:'round',layers:3,palette:['#c92f68','#ee79a6','#ffb5ce'],style:'berry',cream:'#fff6f4',decor:'strawberry',motif:'drape',candles:3,plate:'#ecd7e4',metalPlate:false},
      {name:'香槟玫瑰',shape:'square',layers:2,palette:['#f2d5bd','#eaa6b9'],style:'floral',cream:'#fff0df',decor:'rose',motif:'relief',candles:1,plate:'#c99842',metalPlate:true},
      {name:'薄荷宫廷',shape:'rect',layers:1,palette:['#6fc8ad'],style:'confetti',cream:'#f8fff9',decor:'rose',motif:'drape',candles:5,plate:'#d8bd70',metalPlate:true},
      {name:'蓝莓月光',shape:'heart',layers:2,palette:['#4b3f9d','#8d75d1'],style:'galaxy',cream:'#e9e6ff',decor:'stars',motif:'garland',candles:3,plate:'#343066',metalPlate:false},
      {name:'奶油嘉年华',shape:'rect',layers:2,palette:['#f4dfb8','#f3a6c6'],style:'confetti',cream:'#fffaf0',decor:'strawberry',motif:'relief',candles:5,plate:'#e7c765',metalPlate:true}
    ];
    let presetIndex=-1;
    let customCake=null,originalHidden=false;
    function cakeApi(){const w=frame.contentWindow;return w&&w.__cakeTHREE&&w.__cakeGroup?{T:w.__cakeTHREE,root:w.__cakeGroup}:null}
    function material(T,color,rough=.3,metal=.08,emissive=.12){const c=new T.Color(color);return new T.MeshPhysicalMaterial({color:c,roughness:rough,metalness:metal,clearcoat:.92,clearcoatRoughness:.09,sheen:.65,sheenRoughness:.24,sheenColor:c.clone().offsetHSL(0,-.16,.32),iridescence:.28,iridescenceIOR:1.45,emissive:c.clone().multiplyScalar(emissive),emissiveIntensity:1.35})}
    function glowTexture(T){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.12,'rgba(255,245,190,.95)');g.addColorStop(.38,'rgba(255,145,225,.42)');g.addColorStop(1,'rgba(80,120,255,0)');x.fillStyle=g;x.fillRect(0,0,128,128);return new T.CanvasTexture(c)}
    function addLuxuryAura(T,g){const tex=glowTexture(T),colors=['#fff7bc','#ff87d4','#74dcff','#a58cff','#7dffc9'];for(let i=0;i<95;i++){const a=i*2.399,r=.72+(i%17)/17*1.18,y=.12+((i*7)%37)/37*1.75,s=new T.Sprite(new T.SpriteMaterial({map:tex,color:colors[i%5],transparent:true,opacity:.45+(i%4)*.1,blending:T.AdditiveBlending,depthWrite:false}));s.position.set(Math.cos(a)*r,y,Math.sin(a)*r);const z=.025+(i%5)*.012;s.scale.set(z,z,z);g.add(s)}for(let i=0;i<3;i++){const ring=new T.Mesh(new T.TorusGeometry(1.28+i*.13,.009,6,128),new T.MeshBasicMaterial({color:colors[i],transparent:true,opacity:.48,blending:T.AdditiveBlending,depthWrite:false}));ring.rotation.set(Math.PI/2+.18*i,.1*i,.3*i);ring.position.y=.42+i*.34;g.add(ring)}}
    function makeCakeTexture(T,style,color){const c=document.createElement('canvas');c.width=512;c.height=256;const x=c.getContext('2d'),grad=x.createLinearGradient(0,0,0,256);grad.addColorStop(0,'rgba(255,255,255,.42)');grad.addColorStop(.18,color);grad.addColorStop(.78,color);grad.addColorStop(1,'rgba(35,10,45,.42)');x.fillStyle=grad;x.fillRect(0,0,512,256);

    }
    function addOption(row,label,action,color){const b=document.createElement('button');b.innerHTML=(color?'<span class="swatch" style="background:'+color+';color:'+color+'"></span>':'')+label;b.onclick=()=>{row.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');action();rebuildCake()};row.appendChild(b)}
    function layerOptions(){opts.innerHTML='';const flavor=(color,style,cream)=>()=>{cakeConfig.flavor=color;cakeConfig.palette=Array.isArray(color)?color:[color];cakeConfig.flavor=cakeConfig.palette[0];cakeConfig.style=style;if(cream)cakeConfig.cream=cream};const rows=[['形状',[['圆形',()=>cakeConfig.shape='round'],['爱心',()=>cakeConfig.shape='heart'],['方形',()=>cakeConfig.shape='square'],['长方形',()=>cakeConfig.shape='rect']]],['层数',[['1 层',()=>cakeConfig.layers=1],['2 层',()=>cakeConfig.layers=2],['3 层',()=>cakeConfig.layers=3]]],['侧饰',[['垂坠奶油',()=>cakeConfig.motif='drape'],['宫廷浮雕',()=>cakeConfig.motif='relief'],['波浪花边',()=>cakeConfig.motif='garland'],['星轨糖饰',()=>cakeConfig.motif='constellation']]],['口味',[['星河',flavor('#173fa8','galaxy'),'#3198ff'],['草莓星空',flavor('#d93672','berry'),'#ff4f92'],['蓝莓星空',flavor('#5841b8','galaxy'),'#7465e8'],['巧克力',flavor('#6b2817','floral'),'#d95c20'],['芭比粉',flavor('#ff72bb','floral'),'#ff80c9'],['宝宝蓝',flavor(['#3498d1','#67c8e8','#a8e8f5'],'confetti','#dff9ff'),'#55c9f2'],['奶油白',flavor('#f5e7c8','confetti'),'#fff2cf'],['薄荷绿',flavor('#67cda2','confetti'),'#87edbc'],['香芋紫',flavor('#b58ad3','floral'),'#e2b7f4'],['樱桃红',flavor('#cf183d','berry'),'#ff234c'],['粉饼纹',flavor('#ef75a9','floral'),'#ff91c8']]]];for(const [name,items] of rows){const row=document.createElement('div');row.className='option-row';row.innerHTML='<span class="option-label">'+name+'</span>';for(const [label,action,color] of items)addOption(row,label,action,color);opts.appendChild(row)}}
    function renderOptions(tab){opts.innerHTML='';if(tab==='layers'){layerOptions();return}if(tab==='write'){opts.innerHTML='<input id="writeInput" maxlength="12" placeholder="写一句祝福"><button id="applyWrite">写到蛋糕上</button>';document.querySelector('#applyWrite').onclick=()=>writing.textContent=document.querySelector('#writeInput').value;return}const maps={cream:[['云朵白','#fff4f6'],['樱花粉','#ffb9d5'],['海盐蓝','#a9eaff'],['香槟金','#ffe0a0']],decor:[['草莓奶油花簇','strawberry'],['鎏金星星','stars'],['贝塞尔玫瑰','rose'],['清空','none']],candles:[['1 支',1],['3 支',3],['5 支',5]],plate:[['珍珠樱粉盘','#ecdce8'],['月光冰蓝盘','#d9e8f3'],['流光香芋盘','#e5dcf1']]};for(const [label,value] of maps[tab])addOption(opts,label,()=>{if(tab==='cream')cakeConfig.cream=value;else if(tab==='decor')cakeConfig.decor=value;else if(tab==='candles')cakeConfig.candles=value;else{cakeConfig.plate=value;cakeConfig.metalPlate=false}})}
    document.querySelector('#decorateBtn').addEventListener('click',()=>panel.classList.toggle('show'));
    document.querySelectorAll('.decor-tabs button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.decor-tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderOptions(b.dataset.tab)}));renderOptions('layers');
    document.querySelector('#randomCake').onclick=()=>{const palettes=[{p:['#142d87','#6947c7','#b580dd'],s:'galaxy',c:'#fff8ff'},{p:['#c92f68','#ee79a6','#ffb5ce'],s:'berry',c:'#fff6f4'},{p:['#f2d5bd','#eaa6b9','#cf789b'],s:'floral',c:'#fff0df'},{p:['#6fc8ad','#a7e5cf','#f3e3a5'],s:'confetti',c:'#f8fff9'},{p:['#4b3f9d','#8d75d1','#cab8ef'],s:'galaxy',c:'#eeeaff'}],f=palettes[Math.floor(Math.random()*palettes.length)];cakeConfig.shape=['round','heart','square','rect'][Math.floor(Math.random()*4)];cakeConfig.layers=1+Math.floor(Math.random()*3);cakeConfig.palette=f.p;cakeConfig.flavor=f.p[0];cakeConfig.style=f.s;cakeConfig.cream=f.c;cakeConfig.decor=['strawberry','stars','rose'][Math.floor(Math.random()*3)];cakeConfig.motif=['drape','relief','garland','constellation'][Math.floor(Math.random()*4)];cakeConfig.candles=[1,3,5][Math.floor(Math.random()*3)];const plates=['#ecdce8','#d9e8f3','#f2e6d1','#e5dcf1'];cakeConfig.plate=plates[Math.floor(Math.random()*plates.length)];cakeConfig.metalPlate=false;rebuildCake()};
    document.querySelector('#foldPanel').onclick=()=>panel.classList.remove('show');document.querySelector('#doneCake').onclick=()=>{panel.classList.remove('show');const toast=document.querySelector('#completeToast');toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2200)};
    document.querySelector('#exportCake').onclick=()=>{const a=document.createElement('a');a.href='data:text/plain;charset=utf-8,'+encodeURIComponent('我的星河生日蛋糕装饰已完成');a.download='我的生日蛋糕.txt';a.click()};
    function wireInnerControls(){const d=frame.contentDocument;if(!d)return;const controls=d.querySelector('.controls');if(!controls||d.querySelector('#birthdayMusic'))return;const svg=(paths)=>'<svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+paths+'</svg>';
      const edit=d.createElement('button');edit.id='birthdayEdit';edit.type='button';edit.title='组装我的蛋糕';edit.setAttribute('aria-label','组装我的蛋糕');edit.innerHTML=svg('<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>');edit.addEventListener('click',()=>{panel.classList.add('show')});
      const music=d.createElement('button');music.id='birthdayMusic';music.type='button';music.title='播放音乐';music.setAttribute('aria-label','播放音乐');music.innerHTML=svg('<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>');music.addEventListener('click',e=>{e.stopPropagation();toggleMusic();music.title=musicOn?'暂停音乐':'播放音乐'});
      const blow=d.querySelector('#blow'),fireworks=d.querySelector('#fireworks'),pause=d.querySelector('#pause'),reset=d.querySelector('#reset');
      if(blow){blow.innerHTML=svg('<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"/>');blow.title='吹蜡烛';blow.setAttribute('aria-label','吹蜡烛')}
      if(fireworks){fireworks.innerHTML=svg('<path d="M3 12h12M4 7h8M5 17h9M17 7l4-3M18 12h3M17 17l4 3"/>');fireworks.title='彩带与祝福';fireworks.setAttribute('aria-label','彩带与祝福');fireworks.addEventListener('click',celebrate)}
      controls.innerHTML='';[edit,music,blow,fireworks,pause,reset].forEach(b=>b&&controls.appendChild(b));
    }
    frame.addEventListener('load',wireInnerControls);setTimeout(wireInnerControls,1200);
    const musicGate=document.querySelector('#musicGate');
    const gateTimer=setTimeout(()=>musicGate.classList.add('show'),1800);
    musicGate.addEventListener('click',()=>{if(!musicGate.classList.contains('show'))return;if(!musicOn)toggleMusic();intro.style.opacity='0';intro.style.visibility='hidden';buildHeart()});
    if(location.hash.startsWith('#cake')){intro.style.display='none';showCake();if(location.hash==='#cake-decor')panel.classList.add('show');if(location.hash==='#cake-custom'){cakeConfig.layers=3;cakeConfig.flavor='#d93672';cakeConfig.style='berry';cakeConfig.cream='#fff4f6';cakeConfig.decor='strawberry';cakeConfig.candles=5;setTimeout(rebuildCake,900)}if(location.hash==='#cake-square'){cakeConfig.shape='square';cakeConfig.layers=2;cakeConfig.flavor='#f5e7c8';cakeConfig.style='confetti';cakeConfig.decor='stars';cakeConfig.candles=3;setTimeout(rebuildCake,900)}if(location.hash==='#cake-clicktest'){panel.classList.add('show');setTimeout(()=>{const bs=[...document.querySelectorAll('#decorOptions button')];bs.find(b=>b.textContent.includes('3 层'))?.click();bs.find(b=>b.textContent.includes('草莓星空'))?.click()},1600)}if(location.hash==='#cake-celebrate')setTimeout(celebrate,1400)}
  </script>
</body>
</html>
